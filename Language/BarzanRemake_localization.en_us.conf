 Texts {
  "The Russians have consolidated their hold on Barzan, landing at Chivres Point and capturing Villeny and Chaspinhac.<br /><br /> Everonian Security Forces have been overrun and the local civ-pop has fled, leaving the island on ferry and fishing ships. Only scattered groups of FIA guerrillas remain – once again, a thorn in the enemy's side.<br /><br /> Thankfully, we were able to bring in weapons and supplies from the mainland before Soviet troops consolidated their positions. In fact, a captain of a Everon trawler, sympathetic to our cause, even helped us bring ashore a jeep with a heavy machine gun and set up camp. The spirit of '85 runs deep here, and we can use that to our advantage.<br /><br />It's up to us to maintain the pressure, create some noise, and prepare Barzan for an invasion force. "
