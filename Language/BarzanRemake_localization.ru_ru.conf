 Texts {
  "Русские закрепились на Барзане, высадившись в точке Шифр, и захватив Вильни и Шаспинак.<br /><br /> Силы безопасности Эверона были подавлены, а местное население бежало, покинув остров на пароме и рыболовных судах. Остались лишь разрозненные группы партизан FIA — снова бельмо на глазу врага.<br /><br /> К счастью, нам удалось доставить оружие и припасы с материка до того, как советские войска укрепили свои позиции. Более того, сочувствующий нашему делу капитан траулера «Эверон» даже помог нам высадить на берег джип с крупнокалиберным пулеметом и разбить лагерь. В воздухе витает дух 85-го, и мы можем использовать это в своих интересах.<br /><br />Мы должны продолжить давление, устроить диверсии и подготовить Барзан к вторжению. "
